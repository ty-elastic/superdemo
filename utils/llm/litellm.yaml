apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    name: infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config-file
  namespace: infra
data:
  config.yaml: |
    model_list:
      - model_name: anthropic-claude-4.5-haiku
        litellm_params:
          model: "elasticsearch/anthropic-claude-4.5-haiku"
          api_base: "$elasticsearch_es_endpoint"
          api_key: "$elasticsearch_api_key" 

      - model_name: "mock-openai"
        litellm_params:
          model: openai/gpt-3.5-turbo
          api_key: fake-key
          api_base: http://127.0.0.1:8090/

    general_settings: 
      master_key: "sk-1234"

    litellm_settings:
      require_auth_for_metrics_endpoint: false
      callbacks:
        - prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-deployment
  namespace: infra
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        io.opentelemetry.discovery.logs/enabled: "true"
        instrumentation.opentelemetry.io/inject-sdk: "opentelemetry-operator-system/elastic-instrumentation"
    spec:
      containers:
      - name: postgres-litellm
        image: postgres:16-alpine
        ports:
          - containerPort: 5432
        env:
          - name: POSTGRES_DB
            value: "litellm"
          - name: POSTGRES_PASSWORD
            value: "$POSTGRESQL_PASSWORD"
          - name: POSTGRES_USER
            value: "$POSTGRESQL_USER"
      - name: mock-openai
        image: us-central1-docker.pkg.dev/elastic-sa/tbekiares/mock-openai:$COURSE
        ports:
          - containerPort: 8090
      - name: litellm
        image: us-central1-docker.pkg.dev/elastic-sa/tbekiares/litellm:$COURSE
        args:
          - "--config"
          - "/app/proxy_server_config.yaml"
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: config-volume
          mountPath: /app/proxy_server_config.yaml
          subPath: config.yaml
        env:
          - name: DATABASE_URL
            value: "postgresql://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@127.0.0.1:5432/litellm"
          - name: LITELLM_OTEL_V2
            value: "true"
          - name: LITELLM_OTEL_INTEGRATION_ENABLE_METRICS
            value: "true"
          - name: OTEL_EXPORTER
            value: "otlp_grpc"
          - name: OTEL_ENDPOINT
            value: "http://opentelemetry-kube-stack-daemon-collector.opentelemetry-operator-system.svc.cluster.local:4317"
          - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
            value: "span_and_event"
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 120
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 120
          periodSeconds: 15
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config-file
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: litellm
  name: litellm-service
  namespace: infra
spec:
  ports:
    - name: litellm
      port: 4000
      targetPort: 4000
  type: ClusterIP
  selector:
    app: litellm