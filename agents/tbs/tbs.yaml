apiVersion: v1
kind: ConfigMap
metadata:
  name: tbs-lb-collector-config
  namespace: opentelemetry-operator-system
data:
  config.yaml: |-
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
       
    exporters:
      debug: {}
      loadbalancing:
        routing_key: traceID
        protocol:
          otlp:
            tls:
              insecure: true
        resolver:
          dns:
            hostname: "tbs-sample-collector-headless.opentelemetry-operator-system.svc.cluster.local"
            interval: "5s"

      elasticsearch/otel:
        endpoints:
          - ${ELASTIC_ENDPOINT} # Will be populated from environment variable
        api_key: ${ELASTIC_API_KEY} # Will be populated from environment variable
        mapping:
          mode: otel
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 50000000 # 50MB uncompressed
          block_on_overflow: true
          batch:
            flush_timeout: 1s
            min_size: 1_000_000 # 1MB uncompressed
            max_size: 4_000_000 # 4MB uncompressed
        timeout: 15s
    extensions:
      opamp:
        server:
          http:
            endpoint: "${env:ELASTIC_FLEET_ENDPOINT}/v1/opamp"
            headers:
              Authorization: "ApiKey ${env:ELASTIC_FLEET_OPAMP_API_KEY}"
        instance_uid: "${env:K8S_POD_UID}"
        agent_description:
          non_identifying_attributes:
            elastic.collector.group_name: "tbs-lb"
            elastic.collector.group: "tbs-lb"
            elastic.display.name: "${env:HOSTNAME}"
            config.name: "tbs-lb"
            deployment.environment.name: "${env:K8S_NAMESPACE}"
    service:
      extensions: [opamp]
      telemetry:
        resource:
          data_stream.dataset: 'collectortelemetry.otel'
          elastic.collector.group_name: "tbs-lb"
          elastic.collector.group: "tbs-lb"
          service.namespace: "${env:K8S_NAMESPACE}"
          service.name: "tbs-lb-collector"
          service.instance.id: "${env:HOSTNAME}"
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: "grpc"
                    endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4319"
                    insecure: true 
        logs:
          processors:
            - batch:
                exporter:
                  otlp:
                    protocol: "grpc"
                    endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4319"
                    insecure: true 
        # traces:
        #   processors:
        #     - batch:
        #         exporter:
        #           otlp:
        #             protocol: "grpc"
        #             endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4319"
        #             insecure: true 
      pipelines:
        traces:
          receivers:
            - otlp
          processors: []
          exporters:
            - debug
            - loadbalancing
        metrics:
          receivers:
            - otlp
          processors: []
          exporters:
            - debug
            - elasticsearch/otel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tbs-sample-collector-config
  namespace: opentelemetry-operator-system
data:
  config.yaml: |-
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    connectors:
      elasticapm: {}
      forward: {}

    exporters:
      debug: {}
      elasticsearch/otel:
        endpoints:
          - ${ELASTIC_ENDPOINT} # Will be populated from environment variable
        api_key: ${ELASTIC_API_KEY} # Will be populated from environment variable
        mapping:
          mode: otel
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 50000000 # 50MB uncompressed
          block_on_overflow: true
          batch:
            flush_timeout: 1s
            min_size: 1_000_000 # 1MB uncompressed
            max_size: 4_000_000 # 4MB uncompressed
        timeout: 15s
  
    processors:
      batch:
        send_batch_size: 1000
        timeout: 1s
        send_batch_max_size: 1500
 
      elasticapm: {} # Elastic APM Processor

      tail_sampling:
        decision_wait: 10s
        num_traces: 100
        expected_new_traces_per_sec: 100

        policies:
          # keep any trace that has an error
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]

          # only 25% of automated trades
          - name: partial-probabilistic
            type: and
            and:
              and_sub_policy:
                - name: target-services
                  type: string_attribute
                  string_attribute:
                    key: service.name
                    values: monkey
                - name: probabilistic-rate
                  type: probabilistic
                  probabilistic:
                    sampling_percentage: 25.0

          # keep 100% of user spans
          - name: keep-all-other-services
            type: always_sample

    extensions:
      opamp:
        server:
          http:
            endpoint: "${env:ELASTIC_FLEET_ENDPOINT}/v1/opamp"
            headers:
              Authorization: "ApiKey ${env:ELASTIC_FLEET_OPAMP_API_KEY}"
        instance_uid: "${env:K8S_POD_UID}"
        agent_description:
          non_identifying_attributes:
            elastic.collector.group_name: "tbs-sampler"
            elastic.collector.group: "tbs-sampler"
            elastic.display.name: "${env:HOSTNAME}"
            config.name: "tbs-sampler"
            deployment.environment.name: "${env:K8S_NAMESPACE}"
    service:
      extensions: [opamp]
      telemetry:
        resource:
          data_stream.dataset: 'collectortelemetry.otel'
          elastic.collector.group_name: "tbs-sampler"
          elastic.collector.group: "tbs-sampler"
          service.namespace: "${env:K8S_NAMESPACE}"
          service.name: "tbs-sampler-collector"
          service.instance.id: "${env:HOSTNAME}"
        metrics:
          readers:
            - periodic:
                exporter:
                  otlp:
                    protocol: "grpc"
                    endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4319"
                    insecure: true 
        logs:
          processors:
            - batch:
                exporter:
                  otlp:
                    protocol: "grpc"
                    endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4319"
                    insecure: true 
        # traces:
        #   processors:
        #     - batch:
        #         exporter:
        #           otlp:
        #             protocol: "grpc"
        #             endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4319"
        #             insecure: true 
      pipelines:
        traces/1-process-elastic:
          receivers: [ otlp ]
          processors: [ batch, elasticapm ]
          exporters: [ debug, elasticapm, forward ]

        traces/2-process-tbs:
          receivers: [ forward ]
          processors: [ tail_sampling ]
          exporters: [ debug, elasticsearch/otel ]

        metrics:
          receivers:
            - elasticapm
            - otlp
          processors: []
          exporters:
            - debug
            - elasticsearch/otel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tbs-lb-collector
  namespace: opentelemetry-operator-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tbs-lb-collector
  template:
    metadata:
      labels:
        app: tbs-lb-collector
    spec:
      containers:
        - name: collector
          image: docker.elastic.co/elastic-agent/elastic-agent:$AGENT_VERSION
          command:
            - "elastic-agent"
            - "otel"
            - "--config=/etc/otelcol/config.yaml"
          volumeMounts:
            - mountPath: /etc/otelcol/config.yaml
              name: data
              subPath: config.yaml
              readOnly: true
          env:
            - name: ELASTIC_AGENT_OTEL
              value: '"true"'
            - name: ELASTIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: elastic-secret-otel
                  key: elastic_endpoint
            - name: ELASTIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elastic-secret-otel
                  key: elastic_api_key
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      restartPolicy: Always
      volumes:
        - name: data
          configMap:
            name: tbs-lb-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: tbs-lb-collector-headless
  namespace: opentelemetry-operator-system
spec:
  clusterIP: None  # This defines the Headless Service
  selector:
    app: tbs-lb-collector
  ports:
    - protocol: TCP
      port: 4317
      targetPort: 4317
---
