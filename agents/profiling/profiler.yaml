apiVersion: v1
kind: ServiceAccount
metadata:
  name: profiling-collector
  namespace: opentelemetry-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: profiling-collector
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["apps"]
  resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: profiling-collector
subjects:
- kind: ServiceAccount
  name: profiling-collector
  namespace: opentelemetry-operator-system
roleRef:
  kind: ClusterRole
  name: profiling-collector
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: profiling-exporter-config
  namespace: opentelemetry-operator-system
data:
  exporter.yaml: |-
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    exporters:
      elasticsearch/otel:
        endpoints:
          - ${ELASTIC_ENDPOINT} # Will be populated from environment variable
        api_key: ${ELASTIC_API_KEY} # Will be populated from environment variable
        mapping:
          mode: otel
        sending_queue:
          enabled: true
          sizer: bytes
          queue_size: 50000000 # 50MB uncompressed
          block_on_overflow: true
          batch:
            flush_timeout: 1s
            min_size: 1_000_000 # 1MB uncompressed
            max_size: 4_000_000 # 4MB uncompressed
        timeout: 15s

      debug:
        verbosity: basic

    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8887
      pipelines:
        profiles:
          receivers: [ otlp ]
          exporters: [ debug, elasticsearch/otel ]
        metrics:
          receivers: [ otlp ]
          exporters: [ debug, elasticsearch/otel ]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: profiling-receiver-config
  namespace: opentelemetry-operator-system
data:
  receiver.yaml: |-
    receivers:
      profiling: {}

    # connectors:
    #   profilingmetrics: {}

    processors:
      resource/environment:
        attributes:
          - key: deployment.environment.name
            from_attribute: k8s.namespace.name
            action: upsert
          - key: data_stream.namespace
            from_attribute: k8s.namespace.name
            action: upsert
          - key: resource.attributes.cloud.region
            from_attribute: k8s.namespace.name
            action: upsert

      resource/hostname:
        attributes:
          - key: host.name
            value: "${env:OTEL_K8S_NODE_NAME}"
            action: upsert
          - key: k8s.node.name
            value: "${env:OTEL_K8S_NODE_NAME}"
            action: upsert    
      k8sattributes:
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: container.id
        extract:
          metadata:
          - "k8s.namespace.name"
          - "k8s.pod.name"
          - "k8s.pod.ip"
          - "k8s.pod.uid"
          - "k8s.pod.start_time"
          - k8s.container.name
          - container.id
          - container.image.name
          - container.image.tag
          - "service.name"
          - "service.version"
          - "service.instance.id"

    exporters:
      debug:
        verbosity: basic
      otlp/exporter:
        endpoint: "http://127.0.0.1:4317"
        tls:
          insecure: true

    service:
      pipelines:
        profiles:
          receivers: [ profiling ]
          processors:
            - k8sattributes
            - resource/hostname
            - resource/environment
          #exporters: [ profilingmetrics, otlp/exporter]
          exporters: [ otlp/exporter]
        # metrics:
        #   receivers: [ profilingmetrics ]
        #   exporters: [ debug, otlp/exporter ]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: profiling-collector
  namespace: opentelemetry-operator-system
spec:
  selector:
    matchLabels:
      app: profiling-collector
  template:
    metadata:
      labels:
        app: profiling-collector
    spec:
      serviceAccountName: profiling-collector
      containers:
        - name: exporter
          image: otel/opentelemetry-collector-contrib:0.162.0
          env:
            - name: ELASTIC_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: elastic-secret-otel
                  key: elastic_endpoint
            - name: ELASTIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: elastic-secret-otel
                  key: elastic_api_key
          args:
            - "--config=/etc/otelcol/exporter.yaml"
            - "--feature-gates=service.profilesSupport"
          volumeMounts:
            - mountPath: /etc/otelcol/exporter.yaml
              name: profiling-exporter-config
              subPath: exporter.yaml
              readOnly: true
        - name: receiver
          image: otel/opentelemetry-collector-ebpf-profiler:0.162.0
          env:
            - name: OTEL_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - "--config=/etc/otelcol/receiver.yaml"
            - "--feature-gates=service.profilesSupport"
          volumeMounts:
            - mountPath: /etc/otelcol/receiver.yaml
              name: profiling-receiver-config
              subPath: receiver.yaml
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: true
            #procMount: "Unmasked"
            capabilities:
              add:
                - SYS_ADMIN
      #hostUsers: false
      hostPID: true
      restartPolicy: Always
      volumes:
        - name: profiling-receiver-config
          configMap:
            name: profiling-receiver-config
        - name: profiling-exporter-config
          configMap:
            name: profiling-exporter-config
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory